<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>列表标签</title>
</head>

<body>
  <h2>有序列表</h2>
  <ol>
    <li>有序列表项1</li>
    <li>有序列表项2</li>
    <li>有序列表项3</li>
  </ol>
  <h2>无序列表</h2>
  <ul>
    <li>无序列表项1</li>
    <li>无序列表项2</li>
    <li>无序列表项3</li>
  </ul>
  <h2>描述列表</h2>
  <dl>
    <dt>描述项1</dt>
    <dd>描述内容1</dd>
    <dd>描述内容1-2</dd>
    <dt>描述项2</dt>
    <dd>描述内容2</dd>
    <dt>描述项3</dt>
    <dd>描述内容3</dd>
  </dl>
</body>

</html>
