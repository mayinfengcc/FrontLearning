<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>网页结构和div及span标签</title>
</head>

<body>
  <h2>网页结构标签</h2>
  <header>网页头部标签</header>
  <nav>导航栏标签</nav>
  <!-- <main>主体内容标签</main> -->
  <main>
    <aside>侧边栏标签</aside>
    <article>主要内容区域</article>
  </main>
  <footer>网页底部标签</footer>

  <h2>div和span标签</h2>
  <div>我是div标签，我占满整行</div>
  <div>我是div标签，我占满整行</div>
  <span>我是span标签，我不占满整行</span>
  <span>我是span标签，我不占满整行</span>

</body>

</html>
