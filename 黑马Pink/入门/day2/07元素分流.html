<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <!-- 块级元素 -->
  <h1>我是块级元素</h1>
  <p>我也是块级元素</p>
  <p>
    <strong>我是内联元素</strong>
  </p>
  <!-- 行内元素 -->
  <strong>我是内联元素<strong>我是内联元素</strong></strong>
  <em>我是内联元素<em>我是内联元素</em></em>
  <!-- 特殊情况 p里面不能包含其它块级元素 -->
</body>

</html>
