<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图像标签</title>
</head>

<body>
  <h1>图像标签</h1>
  <img src="pig.png" alt="这是一张猪爸爸图片">
  <img src="pig1.png" alt="这是一张猪爸爸图片">
  <h2>图像标签修改高度和宽度</h2>
  <img src="pig.png" alt="猪爸爸" width="200" height="200">
  <!-- 一般情况下高和宽只能修改一个，另一个会等比例缩放 -->
  <img src="pig.png" alt="猪爸爸" width="300">
  <h2>添加图像标题</h2>
  <img src="pig.png" alt="猪爸爸" title="这是一张猪爸爸图片">
  <h2>插入不同格式的图像</h2>
  <img src="1.jpg" alt="">
  <img src="2.webp" alt="">
  <img src="4.avif" alt="">
  <img src="5.gif" alt="">
  <img src="login.png" alt="">

</body>

</html>
