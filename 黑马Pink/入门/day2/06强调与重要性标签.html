<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>强调与重要性标签</title>
</head>

<body>
  <h2>重要性标签</h2>
  加粗: <strong>加粗文本</strong>
  斜体: <em>斜体文本</em>
  下划线: <ins>下划线文本</ins>
  删除线: <del>删除线文本</del>

  <h2>无语义强调与重要性标签</h2>
  加粗：<b>加粗文本</b>
  斜体：<i>斜体文本</i>
  下划线：<u>下划线文本</u>
  删除线：<s>删除线文本</s>
  <h2>注释标签</h2>
  <!-- 这是一个注释 -->
  <p>这是一个段落</p>
</body>

</html>
