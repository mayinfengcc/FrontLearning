<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS</title>
    <link rel="stylesheet" href="./css/style.css">
    <style>
        p{
            color: blue;
            font-size: 16px;
        }
        h2{
            color: green;
        }
    </style>
</head>
<body>
    <p>这是blue-style的p标签测试</p>
    <h1 style="color: red;">这是一个h1标签测试,使用内联标签</h1>
    <h2>这是一个h2标签测试,使用内部样式</h2>
    <h3>这是一个h3标签测试,使用外部样式</h3>
</body>
</html>
