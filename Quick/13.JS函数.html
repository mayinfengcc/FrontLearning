<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>js函数</title>
</head>
<body>
    <script>
        function hello(){
            console.log('hello js');
        }
        hello();
        function hello_with_return(){
            return 'hello js (return)';
        }
        let a = hello_with_return();
        console.log(a)
    </script>
</body>
</html>
