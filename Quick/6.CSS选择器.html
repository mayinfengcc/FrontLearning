<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS选择器</title>
    <style>
        h2{
            color: aqua;
        }
        .class_select{
            color: orange;
        }
        #header{
            font-size: 28px;
        }
        *{
            font-family: "kaiti";
            font-weight:bolder ;
        }
        .father> .son{
            color: purple;
        }
        .father> p{
            color: pink;
            font-size: larger;
        }
        /* 相邻 */
        h3 + p + h3{
            color: red;
        }
        #element:hover{
            background-color: blue;
        }
    </style>
</head>
<body>
    <h1>不同的选择器</h1>
    <h2>元素选择器</h2>
    <h3 class="class_select">类选择器</h3>
    <h3>h3对比</h3>
    <h4 id="header">id选择器</h4>
    <div class="father">
        <p class="son">子元素选择器测试</p>
    </div>
    <div class="father">
        <p class="son">子元素选择器对比测试</p>
        <p>后代选择器测试</p>
    </div>
    <h3>相邻测试</h3>
    <p>相邻测试</p>
    <h3>相邻测试终</h3>
    <h3 id="element">伪类选择器测试</h3>
</body>
</html>
