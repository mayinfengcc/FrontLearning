<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>定位</title>
    <style>
        .box{
            background-color: aqua;
            height: 350px; 
        }
        .box-normal{
            background-color: aquamarine;
            height: 100px;
            width: 100px;
        }
        .box-relative{
            background-color: bisque;
            width: 100px;
            height: 100px;
            position: relative;
            left: 5px;
            right: 5px;
            top: 10px;
            bottom: 100px;
        }
        .box2{
            height: 350px;
            background-color: lawngreen;
            margin-bottom: 300px;
        }
        .box-absolute{
            height: 100px;
            width: 100px;
            background-color: pink;
            position: absolute;
            left: 120px;
            bottom: 100px;
        }
        .box-foxed{
            background-color: blueviolet;
            width: 100px;
            height: 100px;
            position: fixed;
            right: 0;
            top: 300px;
        }
    </style>
</head>
<body>
    <h1>相对定位</h1>
    <div class="box">
        <div class="box-normal"></div>
        <div class="box-relative"></div>
        <div class="box-normal"></div>
    </div>
    <h1>绝对定位</h1>
    <div class="box2">
        <div class="box-normal"></div>
        <div class="box-absolute"></div>
        <div class="box-normal"></div>     
    </div>
    <h1>固定定位</h1>
    <div class="box-fixed"></div>
</body>
</html>
