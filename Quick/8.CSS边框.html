<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS边框</title>
    <style>
        .demo{
            background-color: aqua;
            display: inline-block;
            border: 5px solid grey;
        }
        .border-demo{
            background-color: burlywood;
            width: 300px;
            height: 200px;
            border-style: solid;
            border-width: 5px 0 20px 10px;/*上右下左*/
            border-color: blueviolet;
            /* border-left: 10px solid gray;
            border-left-color: aliceblue; */
        }
    </style>
</head>
<body>
    <div class="demo">MYF 边框demo</div>
    <div class="border-demo">这是一个border示例</div>
</body>
</html>
